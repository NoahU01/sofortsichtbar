t="600" fill="#6f6a64" text-anchor="end">● Messpunkte im Dashboard</text><path d="M362 175 V208 H48 V204" fill="none" stroke="#1a1817" stroke-width=".45" marker-end="url(#ig-pf)"/><rect x="155.0" y="203.8" width="110" height="8.4" rx="4.2" fill="#fff400"/><text x="210.0" y="209.2" font-family="Poppins, Arial, sans-serif" font-size="3.2" font-weight="600" fill="#1a1817" text-anchor="middle">Sichtbarkeit pflegt deinen Bestand und bringt neue Anlässe.</text><text x="18" y="222" font-family="Poppins, Arial, sans-serif" font-size="2.9" font-weight="700" fill="#1a1817" text-anchor="start" letter-spacing="0.5">STUFE 1 · MARKETING · UNSER SCHWERPUNKT</text><text x="18" y="230" font-family="Lora, Georgia, serif" font-size="6" font-weight="700" fill="#1a1817" text-anchor="start">Interessenten gewinnen.</text><text x="18" y="236.5" font-family="Poppins, Arial, sans-serif" font-size="3.4" font-weight="400" fill="#3d3a37" text-anchor="start">Deine Zielgruppen nehmen dich regelmäßig wahr – und daraus entstehen echte Anfragen.</text><text x="186" y="222" font-family="Poppins, Arial, sans-serif" font-size="2.9" font-weight="700" fill="#6f6a64" text-anchor="start" letter-spacing="0.5">STUFE 2 · VERTRIEB</text><text x="186" y="230" font-family="Lora, Georgia, serif" font-size="6" font-weight="700" fill="#1a1817" text-anchor="start">Abschließen.</text><text x="186" y="236.5" font-family="Poppins, Arial, sans-serif" font-size="3.4" font-weight="400" fill="#3d3a37" text-anchor="start">Terminierung, Beratung, Abschluss – dein Vertrieb, wie du</text><text x="186" y="241.3" font-family="Poppins, Arial, sans-serif" font-size="3.4" font-weight="400" fill="#3d3a37" text-anchor="start">ihn kennst. Nur mit mehr Gesprächen.</text><text x="304" y="222" font-family="Poppins, Arial, sans-serif" font-size="2.9" font-weight="700" fill="#6f6a64" text-anchor="start" letter-spacing="0.5">STUFE 3 · KUNDENBETREUUNG</text><text x="304" y="230" font-family="Lora, Georgia, serif" font-size="6" font-weight="700" fill="#1a1817" text-anchor="start">Kunden halten.</text><text x="304" y="236.5" font-family="Poppins, Arial, sans-serif" font-size="3.4" font-weight="400" fill="#3d3a37" text-anchor="start">Wer regelmäßig von dir hört, bleibt – und bringt neue</text><text x="304" y="241.3" font-family="Poppins, Arial, sans-serif" font-size="3.4" font-weight="400" fill="#3d3a37" text-anchor="start">Anlässe mit.</text><rect x="18" y="252" width="384" height="28" rx="4.0" fill="#fff400"/><text x="25.0" y="261.0" font-family="Poppins, Arial, sans-serif" font-size="3.0" font-weight="700" fill="#1a1817" text-anchor="start" letter-spacing="0.6">SO ARBEITEN WIR</text><text x="25.0" y="270.0" font-family="Lora, Georgia, serif" font-size="6.0" font-weight="700" fill="#1a1817" text-anchor="start">Jeden Monat ein Stück besser.</text><g transform="translate(186.96 261.5) scale(0.3750)" fill="none" stroke="#1a1817" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" /> <path d="M10 4v4" /> <path d="M2 8h20" /> <path d="M6 4v4" /></g><text x="198.96" y="268.0" font-family="Lora, Georgia, serif" font-size="4.2" font-weight="700" fill="#1a1817" text-anchor="start">Umsetzen</text><path d="M231.97 264.0 l2.4 2.0 l-2.4 2.0" fill="none" stroke="#1a1817" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(238.97 261.5) scale(0.3750)" fill="none" stroke="#1a1817" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1" /> <rect width="7" height="5" x="14" y="3" rx="1" /> <rect width="7" height="9" x="14" y="12" rx="1" /> <rect width="7" height="5" x="3" y="16" rx="1" /></g><text x="250.97" y="268.0" font-family="Lora, Georgia, serif" font-size="4.2" font-weight="700" fill="#1a1817" text-anchor="start">Messen</text><path d="M283.98 264.0 l2.4 2.0 l-2.4 2.0" fill="none" stroke="#1a1817" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="rou